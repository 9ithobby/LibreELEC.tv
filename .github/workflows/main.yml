name: Build LibreELEC Rockchip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install All LibreELEC Dependencies
        run: |
          sudo apt update
          sudo apt install -y base-files bash bc binutils bison bzip2 coreutils cpio g++ gcc gawk git gzip libncurses-dev libssl-dev make patch perl python3 rsync sed tar texinfo u-boot-tools unzip wget xz-utils zlib1g-dev squashfs-tools lz4 \
          xfonts-utils rdfind libparse-yapp-perl gperf xsltproc libxml-parser-perl patchutils lzop ccache

      - name: Setup GitHub Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache-libreelec
            sources/
          key: le-rockchip-rk356x-${{ github.run_id }}
          restore-keys: |
            le-rockchip-rk356x-

      - name: Download MT7925 Firmware into Project Overlay
        run: |
          FW_DIR="projects/Rockchip/filesystem/usr/lib/kernel-overlays/base/lib/firmware/mediatek/mt7925"
          mkdir -p "$FW_DIR"
          HOST="gitlab.com"
          PFAD="kernel-firmware/linux-firmware/-/raw/main/mediatek/mt7925"
          curl -A "Mozilla/5.0" -fL "https://${HOST}/${PFAD}/WIFI_RAM_CODE_MT7925_1_1.bin" -o "$FW_DIR/WIFI_RAM_CODE_MT7925_1_1.bin"
          curl -A "Mozilla/5.0" -fL "https://${HOST}/${PFAD}/WIFI_MT7925_PATCH_MCU_1_1_hdr.bin" -o "$FW_DIR/WIFI_MT7925_PATCH_MCU_1_1_hdr.bin"
          curl -A "Mozilla/5.0" -fL "https://${HOST}/${PFAD}/BT_RAM_CODE_MT7925_1_1_hdr.bin" -o "$FW_DIR/BT_RAM_CODE_MT7925_1_1_hdr.bin"
          ls -lh "$FW_DIR"

      - name: Enable Hinlink H68K Device Tree
        run: |
          for FILE in projects/Rockchip/options projects/Rockchip/devices/RK356X/options; do
            if [ -f "$FILE" ] && ! grep -q "rk3568-hinlink-opc-h68k" "$FILE"; then
              echo 'KERNEL_DEVICETREE="$KERNEL_DEVICETREE rockchip/rk3568-hinlink-opc-h68k.dtb"' >> "$FILE"
            fi
          done

      - name: Build Image (mit kontrolliertem 5h15m Timeout)
        id: build_step
        run: |
          export FORCE_UNSAFE_CONFIGURE=1
          export CCACHE_DIR="$HOME/.ccache-libreelec"
          export CCACHE_MAXSIZE="8G"
          
          # Bricht nach 315 Minuten (5h 15m) sauber ab, bevor GitHub den Job hart killt
          set +e
          timeout --signal=SIGINT 315m env PROJECT=Rockchip DEVICE=RK356X ARCH=aarch64 UBOOT_SYSTEM=rock-3a make image
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 130 ]; then
            echo "BUILD_STATUS=timeout" >> $GITHUB_OUTPUT
            echo "Zeitlimit erreicht! Der bisherige Fortschritt wird im Cache gespeichert. Bitte Workflow erneut über 'Run workflow' starten."
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "BUILD_STATUS=success" >> $GITHUB_OUTPUT
            sudo chmod -R a+rX target/ || true
          else
            echo "BUILD_STATUS=failed" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

      - name: Upload Image Artifact
        if: steps.build_step.outputs.BUILD_STATUS == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-MT7925-Image
          path: target/*.img.gz
