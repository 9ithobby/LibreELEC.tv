name: Build LibreELEC Rockchip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Cache for Build Data
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            sources/
          key: le-rockchip-cache-${{ github.ref_name }}
          restore-keys: |
            le-rockchip-cache-

      - name: Build Image via Official LibreELEC Docker
        run: |
          # Nutzt LibreELECs eigenes, isoliertes Docker-Build-System.
          PROJECT=Rockchip DEVICE=RK356X ARCH=aarch64 ./tools/docker/docker-build

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-MT7925-Image
          path: target/*.img.gz
