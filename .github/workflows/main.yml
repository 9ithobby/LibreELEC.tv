name: Build LibreELEC Rockchip H68K (Fixed)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install All LibreELEC Dependencies
        run: |
          sudo apt update
          sudo apt install -y base-files bash bc binutils bison bzip2 coreutils cpio g++ gcc gawk git gzip libncurses-dev libssl-dev make patch perl python3 rsync sed tar texinfo u-boot-tools unzip wget xz-utils zlib1g-dev squashfs-tools lz4 \
          xfonts-utils rdfind libparse-yapp-perl gperf xsltproc libxml-parser-perl patchutils lzop ccache mtools

      - name: Setup GitHub Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache-libreelec
            sources/
          key: le-rockchip-rk356x-v2-${{ github.run_id }}
          restore-keys: |
            le-rockchip-rk356x-v2-

      - name: Download MT7925 & RTL8125 Firmware into Project Overlay
        run: |
          BASE_FW="projects/Rockchip/filesystem/usr/lib/kernel-overlays/base/lib/firmware"
          MT_DIR="$BASE_FW/mediatek/mt7925"
          RTL_DIR="$BASE_FW/rtl_nic"
          mkdir -p "$MT_DIR" "$RTL_DIR"
          
          HOST="git.kernel.org"
          PFAD="pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain"
          
          # MediaTek MT7925 (WLAN / Bluetooth)
          curl -fL "https://${HOST}/${PFAD}/mediatek/mt7925/WIFI_RAM_CODE_MT7925_1_1.bin" -o "$MT_DIR/WIFI_RAM_CODE_MT7925_1_1.bin"
          curl -fL "https://${HOST}/${PFAD}/mediatek/mt7925/WIFI_MT7925_PATCH_MCU_1_1_hdr.bin" -o "$MT_DIR/WIFI_MT7925_PATCH_MCU_1_1_hdr.bin"
          curl -fL "https://${HOST}/${PFAD}/mediatek/mt7925/BT_RAM_CODE_MT7925_1_1_hdr.bin" -o "$MT_DIR/BT_RAM_CODE_MT7925_1_1_hdr.bin"
          
          # Realtek RTL8125 (2.5GbE Netzwerk)
          curl -fL "https://${HOST}/${PFAD}/rtl_nic/rtl8125b-2.fw" -o "$RTL_DIR/rtl8125b-2.fw"
          
          ls -lh "$MT_DIR" "$RTL_DIR"

      - name: Configure Hinlink H68K DTB & Fix eMMC Timing
        run: |
          # 1. H68K DTB sauber zur Liste hinzufügen (rock-3a bleibt erhalten, damit mkimage nicht abbricht)
          sed -i 's/KERNEL_DEVICETREE="/KERNEL_DEVICETREE="rk3568-hinlink-opc-h68k.dtb /g' projects/Rockchip/devices/RK356X/options
          
          # 2. Den eMMC HS400->HS200 Fix direkt in das Build-Skript des Linux-Pakets vor make_target einfügen
          sed -i '/make_target() {/a \  sed -i "s/mmc-hs400-1_8v;/mmc-hs200-1_8v;/g; /mmc-hs400-enhanced-strobe;/d" $PKG_BUILD/arch/arm64/boot/dts/rockchip/rk3568-hinlink-opc-h68k.dts || true' packages/linux/package.mk

      - name: Build Image (mit kontrolliertem 5h15m Timeout)
        id: build_step
        run: |
          export FORCE_UNSAFE_CONFIGURE=1
          export CCACHE_DIR="$HOME/.ccache-libreelec"
          export CCACHE_MAXSIZE="8G"
          
          set +e
          timeout --signal=SIGINT 315m env PROJECT=Rockchip DEVICE=RK356X ARCH=aarch64 UBOOT_SYSTEM=rock-3a make image
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 130 ]; then
            echo "BUILD_STATUS=timeout" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "BUILD_STATUS=success" >> $GITHUB_OUTPUT
          else
            echo "BUILD_STATUS=failed" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

      - name: Patch extlinux.conf inside built Image to use H68K DTB
        if: steps.build_step.outputs.BUILD_STATUS == 'success'
        run: |
          IMG_GZ=$(ls target/*.img.gz | head -n 1)
          gunzip "$IMG_GZ"
          IMG_FILE="${IMG_GZ%.gz}"
          
          # Loop-Device für das Image einrichten und erste Partition (FAT32 Boot) mounten
          LOOP_DEV=$(sudo losetup --find --show --partscan "$IMG_FILE")
          mkdir -p /mnt/le_boot
          sudo mount "${LOOP_DEV}p1" /mnt/le_boot
          
          echo "Inhalt von /mnt/le_boot vor dem Patch:"
          ls -la /mnt/le_boot
          cat /mnt/le_boot/extlinux/extlinux.conf
          
          # Prüfen ob rk3568-hinlink-opc-h68k.dtb existiert und in extlinux.conf eintragen
          if [ -f /mnt/le_boot/rk3568-hinlink-opc-h68k.dtb ]; then
            sudo sed -i 's/rk3568-rock-3a\.dtb/rk3568-hinlink-opc-h68k.dtb/g' /mnt/le_boot/extlinux/extlinux.conf
            echo "ERFOLG: extlinux.conf auf rk3568-hinlink-opc-h68k.dtb umgestellt!"
          else
            echo "FEHLER: rk3568-hinlink-opc-h68k.dtb wurde nicht in die Boot-Partition kopiert!"
            exit 1
          fi
          
          cat /mnt/le_boot/extlinux/extlinux.conf
          sudo umount /mnt/le_boot
          sudo losetup -d "$LOOP_DEV"
          
          # Image wieder komprimieren
          gzip -9 "$IMG_FILE"
          sudo chmod -R a+rX target/ || true

      - name: Upload Image Artifact
        if: steps.build_step.outputs.BUILD_STATUS == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-H68K-Fixed-Image
          path: target/*.img.gz
